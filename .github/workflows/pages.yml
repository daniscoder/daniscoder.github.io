# Сайт собирается MkDocs и выкладывается на GitHub Pages при каждом push в main.
name: Сайт

on:
  push:
    branches: [main]
    # Журнал скачиваний пишет Action раз в 6 часов - на сайт он не влияет
    paths-ignore: ['stats/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      # --strict: битая ссылка или картинка - ошибка, а не молча кривой сайт
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Яндекс и Bing узнают об изменениях сразу, а не при очередном обходе. Отказ
  # IndexNow выкладку не отменяет - сайт уже выложен, задание просто красное.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/indexnow.py
