site_name: Утилиты обработчика сейсмических данных
site_url: https://daniscoder.github.io/
site_author: Danis Arslanov
site_description: >-
  Небольшие программы-помощники к обработке сейсморазведочных данных:
  обрезка снимков экрана, модель ВЧР по первым вступлениям, контур съемки,
  классы удалений для регуляризации 3D. Windows и Linux, без установки.
copyright: '&copy; 2026 Danis Arslanov'

theme:
  name: material
  language: ru
  # Выбор языка по системе при первом заходе - overrides/main.html
  custom_dir: overrides
  # Значок сайта - сейсмические трассы «переменной площадью»: закрашенные фазы
  # складываются в наклонную границу. В шапке - overrides/.icons/seismic/traces.svg
  # (цвет текста шапки), на вкладке браузера - белые трассы на индиговом квадрате.
  icon:
    logo: seismic/traces
  favicon: img/favicon.svg
  # Три положения по кругу: как в системе -> светлая -> темная. Первая палитра
  # подходит всегда, поэтому новый посетитель видит тему системы; ручной выбор
  # Material запоминает в браузере. Подпись кнопки - что будет по нажатию.
  palette:
    - media: '(prefers-color-scheme)'
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: Светлая тема
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Темная тема
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Как в системе
  features:
    # Раздел «Программы» раскрыт сразу: свернутый прятал бы все программы
    - navigation.expand
    - navigation.top
    - toc.follow

plugins:
  # Китайский текст без пробелов: Material делит его на слова пакетом jieba и
  # ставит между словами пробел нулевой ширины - его разделитель и учитывает.
  # Без этого китайское предложение было бы в поиске одним «словом».
  - search:
      separator: '[\s​\-]+'
  # Английская и китайская версии: рядом со страницей <имя>.md лежат <имя>.en.md и
  # <имя>.zh.md, сайт на английском собирается в /en/, на китайском - в /zh/.
  # Картинки и примеры общие, снимки окон - свои на язык (*_en.png, *_zh.png).
  # Переключатель языка в шапке ставит сам плагин.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          site_name: Utilities for Seismic Data Processors
          site_description: >-
            Small helper programs for seismic data processing: screenshot
            cropping, near-surface model from first breaks, survey outline,
            offset classes for 3D regularization. Windows and Linux, no
            installation.
          nav_translations:
            Главная: Home
            Программы: Programs
            Об авторе: About the author
          theme:
            palette:
              - toggle:
                  name: Light theme
              - toggle:
                  name: Dark theme
              - toggle:
                  name: System theme
          extra:
            social:
              - icon: fontawesome/solid/envelope
                link: mailto:arslanovdk@gmail.com
                name: Email
              - icon: fontawesome/brands/telegram
                link: https://t.me/ar_dans
                name: Telegram
              - icon: fontawesome/brands/github
                link: https://github.com/daniscoder
                name: GitHub
        - locale: zh
          name: 中文
          build: true
          site_name: 地震数据处理实用工具
          site_description: >-
            地震数据处理的小型辅助程序：截图裁剪、根据初至建立近地表模型、工区轮廓、
            三维规则化的偏移距分组。支持 Windows 和 Linux，无需安装。
          nav_translations:
            Главная: 首页
            Программы: 程序
            Об авторе: 关于作者
          theme:
            palette:
              - toggle:
                  name: 浅色主题
              - toggle:
                  name: 深色主题
              - toggle:
                  name: 跟随系统
          extra:
            social:
              - icon: fontawesome/solid/envelope
                link: mailto:arslanovdk@gmail.com
                name: 邮箱
              - icon: fontawesome/brands/telegram
                link: https://t.me/ar_dans
                name: Telegram
              - icon: fontawesome/brands/github
                link: https://github.com/daniscoder
                name: GitHub

extra_css:
  - stylesheets/extra.css

nav:
  - Главная: index.md
  - Программы:
      - autocrop: autocrop.md
      - lmoToXY: lmotoxy.md
      - polygon: polygon.md
      - histogram_for_reg: histogram_for_reg.md
      - gPad: gpad.md
      - ListQC: listqc.md
  - Об авторе: author.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:arslanovdk@gmail.com
      name: Почта
    - icon: fontawesome/brands/telegram
      link: https://t.me/ar_dans
      name: Telegram
    - icon: fontawesome/brands/github
      link: https://github.com/daniscoder
      name: GitHub
