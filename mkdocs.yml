site_name: Утилиты сейсмообработчика
site_url: https://daniscoder.github.io/
site_author: Danis Arslanov
site_description: >-
  Небольшие программы-помощники к обработке сейсморазведочных данных:
  классы удалений для регуляризации 3D, контур съемки, модель ВЧР по первым
  вступлениям, обрезка снимков экрана. Windows и Linux, без установки.
copyright: '&copy; 2026 Danis Arslanov'

theme:
  name: material
  language: ru
  # Выбор языка по системе при первом заходе - overrides/main.html
  custom_dir: overrides
  # Три положения по кругу: как в системе -> светлая -> темная. Первая палитра
  # подходит всегда, поэтому новый посетитель видит тему системы; ручной выбор
  # Material запоминает в браузере. Подпись кнопки - что будет по нажатию.
  palette:
    - media: '(prefers-color-scheme)'
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: Светлая тема
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Темная тема
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Как в системе
  features:
    # Раздел «Программы» раскрыт сразу: свернутый прятал бы все программы
    - navigation.expand
    - navigation.top
    - toc.follow

plugins:
  - search
  # Английская версия: рядом со страницей <имя>.md лежит <имя>.en.md, сайт на
  # английском собирается в /en/. Картинки и примеры общие. Переключатель языка
  # в шапке ставит сам плагин.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          site_name: Seismic Processing Utilities
          site_description: >-
            Small helper programs for seismic data processing: offset classes
            for 3D regularization, survey outline, near-surface model from first
            breaks, screenshot cropping. Windows and Linux, no installation.
          nav_translations:
            Главная: Home
            Программы: Programs
            Об авторе: About the author
          theme:
            palette:
              - toggle:
                  name: Light theme
              - toggle:
                  name: Dark theme
              - toggle:
                  name: System theme
          extra:
            social:
              - icon: fontawesome/solid/envelope
                link: mailto:arslanovdk@gmail.com
                name: Email
              - icon: fontawesome/brands/telegram
                link: https://t.me/ar_dans
                name: Telegram
              - icon: fontawesome/brands/github
                link: https://github.com/daniscoder
                name: GitHub

extra_css:
  - stylesheets/extra.css

nav:
  - Главная: index.md
  - Программы:
      - histogram_for_reg: histogram_for_reg.md
      - polygon: polygon.md
      - lmoToXY: lmotoxy.md
      - autocrop: autocrop.md
      - gPad: gpad.md
      - ListQC: listqc.md
  - Об авторе: author.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:arslanovdk@gmail.com
      name: Почта
    - icon: fontawesome/brands/telegram
      link: https://t.me/ar_dans
      name: Telegram
    - icon: fontawesome/brands/github
      link: https://github.com/daniscoder
      name: GitHub
