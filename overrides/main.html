{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    /* Язык сайта по системе. Русская версия - в корне, английская - в /en/,
       китайская - в /zh/. Если человек выбрал язык переключателем в шапке,
       берется его выбор (он запоминается в браузере); если нет - первый язык
       браузера: русский, белорусский, казахский - русская версия, китайский -
       китайская, остальные - английская. Переход через location.replace:
       «Назад» не возвращает на страницу, с которой перенаправили.
       Поисковых роботов не перенаправлять: робот Google ходит с английским
       языком и иначе увидел бы вместо русских страниц переадресацию на /en/.
       Языковые версии поисковикам и так известны из sitemap.xml. */
    (function () {
      if (/bot|crawl|spider|slurp|yandex|baidu/i.test(navigator.userAgent)) {
        return;
      }
      var KEY = 'site-language';
      var PREFIX = /^\/(en|zh)(\/|$)/;
      var path = location.pathname;
      var match = PREFIX.exec(path);
      var current = match ? match[1] : 'ru';

      // Ссылки переключателя языка у Material - с атрибутом hreflang.
      document.addEventListener('click', function (event) {
        var link = event.target.closest ? event.target.closest('a[hreflang]') : null;
        if (link) {
          try { localStorage.setItem(KEY, link.getAttribute('hreflang')); } catch (e) {}
        }
      }, true);

      var wanted = null;
      try { wanted = localStorage.getItem(KEY); } catch (e) {}
      if (wanted !== 'ru' && wanted !== 'en' && wanted !== 'zh') {
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        wanted = /^(ru|be|kk)\b/i.test(first) ? 'ru' : /^zh\b/i.test(first) ? 'zh' : 'en';
      }
      if (wanted === current) {
        return;
      }
      var base = path.replace(PREFIX, '/');
      var target = wanted === 'ru' ? base : '/' + wanted + base;
      location.replace(target + location.search + location.hash);
    })();
  </script>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <!-- Посещения - GoatCounter (arslanovdk.goatcounter.com): без cookie, поэтому
       без баннера согласия; с localhost не считает. Нажатия на кнопки скачивания
       - событиями download/<тег>/<файл>: счетчик релиза GitHub обнуляется при
       каждой перевыкладке файла, а эти события копятся. -->
  <script data-goatcounter="https://arslanovdk.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script>
    document.addEventListener('click', function (event) {
      var link = event.target.closest ? event.target.closest('a[href*="/releases/download/"]') : null;
      if (!link || !window.goatcounter || !window.goatcounter.count) {
        return;
      }
      var file = link.getAttribute('href').split('/releases/download/')[1];
      window.goatcounter.count({path: 'download/' + file, title: file, event: true});
    });
  </script>
{% endblock %}
